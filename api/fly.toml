app = "sosh-api"
primary_region = "ord"   # Chicago — change to nearest region when deploying

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep alive — no cold starts on Pulse events
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  ENVIRONMENT = "production"

# Secrets (never stored here — set via: flyctl secrets set KEY=value)
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_JWT_SECRET
# DATABASE_URL
# REDIS_URL
# R2_ACCESS_KEY
# R2_SECRET_KEY
# R2_ENDPOINT
# R2_BUCKET_NAME
# EXPO_ACCESS_TOKEN
